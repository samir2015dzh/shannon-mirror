name: Sync upstream

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all branches and tags from upstream
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git clone --bare https://github.com/KeygraphHQ/shannon.git upstream.git
          cd upstream.git
          git push --force "https://x-access-token:${TOKEN}@github.com/samir2015dzh/shannon-mirror.git" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

      - name: Sync fork samir2015dzh/shannon via merge-upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/samir2015dzh/shannon/merge-upstream \
            -d '{"branch":"main"}')
          echo "HTTP ${status}"
          cat resp.json
          if [ "${status}" != "200" ]; then
            echo "merge-upstream failed for samir2015dzh/shannon (main)"
            exit 1
          fi
